server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz { return 200 "ok\n"; }

  location /api/sms          { proxy_pass http://ingestion:5101; }
  location /api/transactions { proxy_pass http://ledger:5201; }
  location /api/categories   { proxy_pass http://ledger:5201; }
  location /api/rules        { proxy_pass http://ledger:5201; }
  location /api/recurring    { proxy_pass http://ledger:5201; }
  location /api/budgets      { proxy_pass http://budgets:5301; }

  location /hubs/ {
    proxy_pass http://budgets:5301;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location / { try_files $uri /index.html; }
}
